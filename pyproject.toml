[build-system]
requires      = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "ree-miner"
version     = "0.1.0"
description = "Rare-earth-element (REE) binding protein discovery pipeline"
readme      = "README.md"
license     = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords    = [
    "rare earth elements", "lanthanides", "protein engineering",
    "bioinformatics", "metagenomics", "structural biology",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.81",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "requests>=2.28",
    "pyhmmer>=0.11",
    "pyrodigal>=3.0",
    "boto3>=1.26",
]

[project.optional-dependencies]
pdb = [
    "gemmi>=0.6",    # CIF/mmCIF parsing for structure mining
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
ree-miner = "ree_miner.cli:main"

[project.urls]
Homepage      = "https://github.com/acadev/ree-miner"
Documentation = "https://github.com/acadev/ree-miner#readme"
"Bug Tracker" = "https://github.com/acadev/ree-miner/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
